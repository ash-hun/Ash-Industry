name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --frozen --all-packages --extra web --extra scheduler --extra mcp
      - run: uv run ruff check src tests packages mcp
      - run: uv run python scripts/sort_imports.py --check src tests scripts mcp packages
      - run: uv run pytest tests/unit -q
      - run: uv run pytest tests/integ -q
      # workspace 패키지(행정문서 파서와 docs MCP 서버)는 자기 tests 를 갖는다
      - run: uv run pytest packages -q
